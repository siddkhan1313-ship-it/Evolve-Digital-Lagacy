
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureBloomX (FBX) - Elite AI Website Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#0ea5e9', // sky-500
                            light: '#7dd3fc',   // sky-300
                            dark: '#0369a1',    // sky-700
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --secondary: #6366f1;
            --accent: #2dd4bf;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
            margin: 0;
            padding: 0;
        }
        
        /* Dark Mode mesh with Sky Blue */
        .dark .mesh-gradient {
            background: 
                radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(45, 212, 191, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
            background-color: #0f172a;
        }

        /* Upgraded Light Mode mesh - Sky Blue Focus */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 95% 5%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 95% 95%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 5% 95%, rgba(14, 165, 233, 0.08) 0%, transparent 40%);
            background-color: #f0f9ff; /* sky-50 */
        }

        .gradient-text {
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 50%, #2dd4bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .dark .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #5eead4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Light Mode Glass */
        .glass-morphism {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(14, 165, 233, 0.15);
            box-shadow: 0 4px 30px rgba(14, 165, 233, 0.05);
        }

        .dark .glass-morphism {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        /* Vibrant Card */
        .vibrant-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(14, 165, 233, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dark .vibrant-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .vibrant-card:hover {
            border-color: rgba(14, 165, 233, 0.4);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.2);
            background: rgba(255, 255, 255, 1);
        }
        
        .dark .vibrant-card:hover {
            background: rgba(30, 41, 59, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(-8px) scale(1.02);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #bae6fd; /* sky-200 */
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7dd3fc; /* sky-300 */
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
